<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 2</title>
    <link href="plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="display-5 text-secondary mb-4">
            Gestión de Productos 
            <span class="badge bg-secondary rounded-pill fs-4 align-middle">Nuevo</span>
        </h1>
        <form>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="nombreProducto" class="form-label text-secondary">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombreProducto" placeholder="Ej. Monitor 24 pulgadas">
                </div>
                <div class="col-12 col-md-6">
                    <label for="colorCategoria" class="form-label text-secondary d-block">Etiqueta de Color</label>
                    <input type="color" class="form-control form-control-color" id="colorCategoria" value="#0d6efd" title="Elija el color">
                </div>
                <div class="col-12">
                    <label for="categorias" class="form-label text-secondary">Categorías Asignadas</label>
                    <select class="form-select" id="categorias" multiple aria-label="Categorías asignadas" rows="3">
                        <option value="hardware" selected>Hardware</option>
                        <option value="perifericos">Periféricos</option>
                        <option value="oficina">Oficina</option>
                    </select>
                </div>
                <div class="col-12 my-3">
                    <label class="form-label text-secondary d-block">Estado Inicial</label>
                    <div class="btn-group" role="group" aria-label="Estado del producto">
                        <input type="radio" class="btn-check" name="estadoProducto" id="disponible" autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="disponible">Disponible</label>
                        
                        <input type="radio" class="btn-check" name="estadoProducto" id="agotado" autocomplete="off">
                        <label class="btn btn-outline-primary" for="agotado">Agotado</label>
                    </div>
                </div>
                <div class="col-12 pt-2">
                    <button type="submit" class="btn btn-success me-2">Guardar Producto</button>
                    <button type="reset" class="btn btn-outline-secondary">Cancelar</button>
                </div>
            </div>
        </form>
    </div>
    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
