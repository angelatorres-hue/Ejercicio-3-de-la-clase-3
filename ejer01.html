<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 1</title>
    <link href="plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-md-6">
                
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    Ingrese sus credenciales para acceder al panel.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card p-4 shadow-sm border-0">
                    <h2 class="text-center mb-4 text-secondary">Iniciar Sesión</h2>
                    <form>
                        <div class="mb-3">
                            <label for="usuario" class="form-label text-secondary">Usuario</label>
                            <input type="text" class="form-control" id="usuario" placeholder="Ingrese su usuario">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Ingresar al Sistema</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
