<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 4</title>
    <link href="plantilla/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="alert alert-warning alert-dismissible fade show mb-4" role="alert">
            Atención: Mantenimiento de servidor programado para el fin de semana.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <h1 class="display-5 text-secondary mb-4">Panel de Control</h1>
        <div class="input-group mb-4">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="text" class="form-control" placeholder="Buscar módulo o reporte..." aria-label="Buscar módulo o reporte" aria-describedby="basic-addon1">
            <button class="btn btn-primary" type="button">Buscar</button>
        </div>
        <div class="row g-4 align-items-start">
            <div class="col-12 col-md-3">
                <div class="btn-group-vertical w-100" role="group" aria-label="Menú principal">
                    <button type="button" class="btn btn-primary text-start fw-bold">Resumen General</button>
                    <button type="button" class="btn btn-outline-primary text-start">Ventas</button>
                    <button type="button" class="btn btn-outline-primary text-start">Inventario</button>
                    <button type="button" class="btn btn-outline-primary text-start">Reportes</button>
                </div>
            </div>
            <div class="col-12 col-md-9">
                <div class="row row-cols-1 row-cols-sm-3 g-3">
                    <div class="col">
                        <div class="card h-100 text-center py-3 border shadow-sm">
                            <div class="card-body p-2">
                                <h6 class="card-title text-secondary fw-bold mb-2">Servicios Activos</h6>
                                <span class="badge bg-success rounded-pill px-3 py-2 fs-6">12 Online</span>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 text-center py-3 border shadow-sm">
                            <div class="card-body p-2">
                                <h6 class="card-title text-secondary fw-bold mb-2">Alertas Sistema</h6>
                                <span class="badge bg-warning text-dark rounded-pill px-3 py-2 fs-6">2 Revisar</span>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card h-100 text-center py-3 border shadow-sm">
                            <div class="card-body p-2">
                                <h6 class="card-title text-secondary fw-bold mb-2">Usuarios Totales</h6>
                                <span class="badge bg-primary rounded-pill px-3 py-2 fs-6">1,250</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="plantilla/js/bootstrap.bundle.min.js"></script>
</body>
</html>
